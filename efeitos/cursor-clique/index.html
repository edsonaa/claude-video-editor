<!doctype html>
<html lang="pt-BR" data-composition-variables='[]'>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<link rel="stylesheet" href="../_comum/tema.css" />
<style>
#cursor { position: absolute; width: 54px; height: 54px; margin: -6px 0 0 -8px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); }
#onda { position: absolute; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 6px solid var(--t-destaque); }
#balao { position: absolute; white-space: nowrap; padding: 14px 26px; font-size: 32px; font-weight: 700;
  background: var(--t-destaque); color: var(--t-fundo); border-radius: 14px; }
</style>
</head>
<body>
<div id="root" data-composition-id="efeito" data-start="0" data-duration="2.5" data-width="1920" data-height="1080" data-fps="30" data-motion-blur="on" data-motion-blur-tier="filter">
<div class="clip" data-start="0" data-duration="2.5">
    <div id="onda"></div>
    <div id="balao" class="texto"></div>
    <svg id="cursor" viewBox="0 0 24 24"><path d="M3 2 L20 12 L12.5 13.5 L16.5 21.5 L13.5 23 L9.5 15 L3 20 Z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </div>
</div>
<script src="../_comum/tema.js"></script>
<script>
const { v, df, D, W, H } = HF;
const [x0, y0] = HF.lista("de").map(Number), [x1, y1] = HF.lista("ate").map(Number);
const px = (x) => x * W, py = (y) => y * H;
const balao = document.getElementById("balao"); balao.textContent = v.rotulo || "";
if (!v.rotulo) balao.style.display = "none";
for (const id of ["onda", "balao"]) { const e = document.getElementById(id); e.style.left = px(x1) + "px"; e.style.top = py(y1) + "px"; }
const cur = document.getElementById("cursor");
const o = { t: 0 };
const curva = (t) => { // bezier quadrática: arco natural da mão
  const cx = (px(x0) + px(x1)) / 2 + (py(y1) - py(y0)) * 0.25, cy = (py(y0) + py(y1)) / 2 - Math.abs(px(x1) - px(x0)) * 0.15;
  const a = 1 - t;
  return [a * a * px(x0) + 2 * a * t * cx + t * t * px(x1), a * a * py(y0) + 2 * a * t * cy + t * t * py(y1)];
};
const por = () => { const [x, y] = curva(o.t); cur.style.left = x + "px"; cur.style.top = y + "px"; };
por();
const tl = HF.timeline();
HF.entrada(tl, cur, { opacity: 0, scale: 0.6 }, 0, { duracao: df(6) });
tl.fromTo(o, { t: 0 }, { t: 1, duration: df(20), ease: "power3.inOut", lazy: false, onUpdate: por }, df(4));
tl.fromTo(cur, { scale: 1 }, { scale: 0.82, duration: df(3), ease: "power2.out", yoyo: true, repeat: 1, lazy: false, immediateRender: false }, df(26));
tl.fromTo("#onda", { scale: 0.2, opacity: 1 }, { scale: 1.3, opacity: 0, duration: df(16), ease: "power2.out", lazy: false }, df(26));
tl.set(balao, { xPercent: -50, yPercent: -175 }, 0);
if (v.rotulo) HF.entrada(tl, balao, { y: 16, opacity: 0, scale: 0.9 }, df(30));
HF.saida(tl, ["#cursor", "#balao"], { opacity: 0 }, D - HF.saidaD());
HF.pronto(tl);
</script>
</body>
</html>
